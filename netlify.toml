# MANNUM MARAMUM IYAKKAM — NETLIFY CONFIGURATION
# ==============================================================================

[build]
  # Publish directory containing index.html, vendor-registration.html, public/, etc.
  publish = "."

# Production Headers for performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Navigation shortcuts
[[redirects]]
  from = "/volunteer"
  to = "/#volunteer"
  status = 302

[[redirects]]
  from = "/volunteers"
  to = "/#volunteer"
  status = 302

[[redirects]]
  from = "/volunteer-registration"
  to = "/#volunteer"
  status = 302

[[redirects]]
  from = "/nature-activities"
  to = "/#gogreen"
  status = 302

# Portal Rewrites
[[redirects]]
  from = "/vendor-registration"
  to = "/vendor-registration.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/public/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/public/admin/index.html"
  status = 200

# Backend API and Uploads reverse proxy fallback
# When backend URL is deployed, uncomment and update 'to' destination:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL/api/:splat"
#   status = 200
#   force = true

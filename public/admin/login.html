<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Mannum Maramum Iyakkam</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest-950: #08160f;
      --forest-900: #0f2d1a;
      --forest-800: #1a4d2e;
      --forest-700: #2d6a4f;
      --forest-600: #40916c;
      --lime: #b7e23a;
      --lime-dark: #8cb51f;
      --cream: #fbf9f4;
      --cream-2: #f2ede2;
      --cream-dark: #e5ded0;
      --text-dark: #142419;
      --text-muted: #526759;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --shadow: 0 16px 40px rgba(8, 22, 15, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(183, 226, 58, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(26, 77, 46, 0.25) 0%, transparent 50%),
                  var(--cream-2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-dark);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--cream);
      border: 1px solid var(--cream-dark);
      border-radius: 28px;
      padding: 44px 38px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--forest-800), var(--lime), var(--forest-600));
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: #ffffff;
      border-radius: 20px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(15, 45, 26, 0.1);
      border: 1px solid rgba(26, 77, 46, 0.15);
    }

    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--forest-900);
      letter-spacing: 0.04em;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--forest-900);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-dark);
      background: #ffffff;
      border: 1.5px solid rgba(15, 45, 26, 0.18);
      border-radius: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--forest-700);
      box-shadow: 0 0 0 4px rgba(183, 226, 58, 0.25);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: var(--forest-900);
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .alert-error {
      background: var(--danger-bg);
      border: 1px solid rgba(220, 38, 38, 0.25);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(183, 226, 58, 0.2);
      border: 1px solid rgba(140, 181, 31, 0.4);
      color: var(--forest-900);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--forest-800);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(26, 77, 46, 0.25);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--forest-900);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(26, 77, 46, 0.35);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--forest-800);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .security-notice {
      margin-top: 28px;
      padding: 12px 14px;
      background: rgba(15, 45, 26, 0.04);
      border-radius: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo-wrap">
          <img src="/logo.png" alt="Mannum Maramum Iyakkam Logo">
        </div>
        <h1 class="brand-title">MANNUM MARAMUM</h1>
        <p class="brand-sub">Official NGO Administration Portal</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <!-- Development Credentials Banner -->
      <div style="background: rgba(183, 226, 58, 0.15); border: 1px solid rgba(140, 181, 31, 0.35); border-radius: 14px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.82rem; color: var(--forest-900);">
        <div style="font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;">
          <span>🔑 Development Admin Access</span>
          <button type="button" id="fillDevCredsBtn" style="background: var(--forest-800); color: #fff; border: none; border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; cursor: pointer; font-weight: 700;">Autofill</button>
        </div>
        <div style="line-height: 1.5; color: var(--text-dark);">
          Username: <strong>admin</strong> | Password: <strong>Admin@123</strong>
        </div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="usernameOrEmail">Email or Username</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="usernameOrEmail"
              name="usernameOrEmail"
              class="form-input"
              placeholder="e.g. admin@mannummaramum.org"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your secure password"
              required
            >
            <button type="button" class="toggle-pwd-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Sign In to Dashboard</span>
        </button>
      </form>

      <div class="security-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Protected area for authorized environmental administrators</span>
      </div>

      <div class="login-footer">
        <a href="/">← Return to Public Website</a>
      </div>
    </div>
  </div>

  <script>
    // Auto-redirect if already authenticated
    const apiBase = window.API_BASE_URL || window.__API_URL__ || '';
    const token = localStorage.getItem('mm_admin_token');
    if (token) {
      fetch(`${apiBase}/api/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = '/admin';
        } else {
          localStorage.removeItem('mm_admin_token');
          localStorage.removeItem('mm_admin_user');
        }
      })
      .catch(() => {});
    }

    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Autofill dev credentials button
    const fillDevCredsBtn = document.getElementById('fillDevCredsBtn');
    if (fillDevCredsBtn) {
      fillDevCredsBtn.addEventListener('click', () => {
        document.getElementById('usernameOrEmail').value = 'admin';
        passwordInput.value = 'Admin@123';
        passwordInput.setAttribute('type', 'text');
        eyeIcon.innerHTML = `
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        `;
      });
    }

    // Form submission
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = passwordInput.value;

      if (!usernameOrEmail || !password) {
        showAlert('Please enter both your email/username and password.', 'error');
        return;
      }

      // Show loading
      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Verifying Credentials...';

      try {
        const response = await fetch(`${apiBase}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernameOrEmail, password })
        });

        const data = await response.json();

        if (data.success && data.token) {
          localStorage.setItem('mm_admin_token', data.token);
          localStorage.setItem('mm_admin_user', JSON.stringify(data.user));
          showAlert('Login successful! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        } else {
          showAlert(data.message || 'Login failed. Please check your credentials.', 'error');
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Sign In to Dashboard';
        }
      } catch (err) {
        showAlert('Connection error. Please check if the server is running.', 'error');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In to Dashboard';
      }
    });

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = type === 'success' ? 'alert alert-success' : 'alert alert-error';
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
